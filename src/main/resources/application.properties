# Every value can be overridden with an environment variable (shown in ${NAME:default}).

# datasource connection properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres1}

# JWT signing key (base64). Set JWT_SECRET in any shared or deployed environment.
jwt.base64-secret=${JWT_SECRET:}
jwt.token-validity-in-seconds=${JWT_VALIDITY_SECONDS:86400}
jwt.token-validity-in-seconds-for-remember-me=108000

# Frontend origins allowed to call the API (comma separated): CRA/Next on 3000, Vite on 5173.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

server.error.include-stacktrace=never
server.port=${PORT:9090}
